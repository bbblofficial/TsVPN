name: Run 3x-ui Panel (GitHub Runner as Server)

on:
  workflow_dispatch:
    inputs:
      tailscale_auth_key:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

      xui_username:
        description: '3x-ui admin username'
        required: true
        default: 'admin'
        type: string

      xui_password:
        description: '3x-ui admin password'
        required: true
        type: string

      xui_panel_port:
        description: '3x-ui panel port'
        required: true
        default: '2053'
        type: string

      xui_web_base_path:
        description: '3x-ui web base path (leave empty to auto-generate)'
        required: false
        default: ''
        type: string

      keep_alive_minutes:
        description: 'How many minutes to keep the runner (server) alive'
        required: true
        default: '30'
        type: string

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # حداکثر ۶ ساعت

    steps:
      # 0) (اختیاری) چک‌اوت — برای اجرای این وورکفلو لازم نیست ولی بی‌ضرره
      - name: Checkout
        uses: actions/checkout@v4

      # 1) نصب Tailscale و اتصال به Tailnet روی خود Runner
      - name: Install & Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ inputs.tailscale_auth_key }}
          tags: tag:ci

      - name: Show Tailscale IP
        run: echo "Tailscale IP = $(tailscale ip -4)"

      # 2) نصب 3x-ui روی خود Runner (نیاز به sudo)
      - name: Install 3x-ui on the runner
        env:
          XUI_USERNAME: ${{ inputs.xui_username }}
          XUI_PASSWORD: ${{ inputs.xui_password }}
          XUI_PANEL_PORT: ${{ inputs.xui_panel_port }}
          XUI_WEB_BASE_PATH_IN: ${{ inputs.xui_web_base_path }}
        run: |
          BASEPATH="${XUI_WEB_BASE_PATH_IN}"
          if [ -z "$BASEPATH" ]; then
            BASEPATH=$(openssl rand -hex 8)
          fi

          sudo XUI_NONINTERACTIVE=1 \
               XUI_USERNAME="$XUI_USERNAME" \
               XUI_PASSWORD="$XUI_PASSWORD" \
               XUI_PANEL_PORT="$XUI_PANEL_PORT" \
               XUI_WEB_BASE_PATH="$BASEPATH" \
               bash -c "$(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)"

          # ذخیره base path برای گام بعدی
          echo "BASEPATH=$BASEPATH" >> "$GITHUB_ENV"

      # 3) چاپ لینک پنل روی Tailscale IP خود Runner
      - name: Print VPN Panel URL
        run: |
          TSIP=$(tailscale ip -4)
          URL="http://${TSIP}:${{ inputs.xui_panel_port }}/${BASEPATH}"

          echo "============================================="
          echo "   3x-ui VPN Panel is UP"
          echo "============================================="
          echo "Panel URL  : $URL"
          echo "Username   : ${{ inputs.xui_username }}"
          echo "Password   : ${{ inputs.xui_password }}"
          echo "Tailscale  : $TSIP"
          echo "Expires in : ${{ inputs.keep_alive_minutes }} minutes"
          echo "============================================="

          # مخفی‌سازی رمز در لاگ‌های بعدی
          echo "::add-mask::${{ inputs.xui_password }}"

          # نمایش وضعیت سرویس
          sudo systemctl status x-ui --no-pager | head -8 || true

      # 4) زنده نگه‌داشتن Runner تا پنل در دسترس بمونه
      - name: Keep runner alive (server is running)
        run: |
          MIN="${{ inputs.keep_alive_minutes }}"
          echo "Keeping the server alive for ${MIN} minutes..."
          echo "Panel will die when this step ends."
          for i in $(seq 1 "$MIN"); do
            echo "[$i/${MIN}] still alive - $(date -u +%H:%M:%S)"
            sleep 60
          done